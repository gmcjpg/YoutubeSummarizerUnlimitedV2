<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube AI Summarizer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #fff;
    }

    .header {
      background: #dc2626;
      color: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-title { font-weight: 700; font-size: 14px; letter-spacing: 0.01em; }
    .header-sub   { font-size: 11px; opacity: 0.85; }

    .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .label {
      font-size: 11px;
      font-weight: 600;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    select, input[type="number"] {
      background: #f7f7f7;
      border: 1px solid #ddd;
      border-radius: 6px;
      color: #1a1a1a;
      font-size: 12px;
      font-family: inherit;
      padding: 6px 8px;
      outline: none;
      cursor: pointer;
    }
    select:focus, input[type="number"]:focus { border-color: #dc2626; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .toggle-label { font-size: 12px; color: #333; }

    /* Toggle switch */
    .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background: #ccc; border-radius: 20px; transition: 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute; height: 14px; width: 14px;
      left: 3px; bottom: 3px;
      background: white; border-radius: 50%; transition: 0.2s;
    }
    .switch input:checked + .slider            { background: #dc2626; }
    .switch input:checked + .slider::before   { transform: translateX(14px); }

    .divider { border: none; border-top: 1px solid #eee; }

    .provider-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    .provider-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: #f0f0f0; border: 1.5px solid #ddd; border-radius: 8px;
      cursor: pointer; padding: 7px 4px; font-size: 11px; font-family: inherit;
      color: #555; font-weight: 500; transition: 0.15s;
    }
    .provider-btn:hover       { background: #e8e8e8; }
    .provider-btn.active      { border-color: #dc2626; color: #dc2626; background: #fff5f5; }
    .provider-dot             { width: 8px; height: 8px; border-radius: 50%; }

    .save-btn {
      background: #dc2626; border: none; border-radius: 20px; color: #fff;
      cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600;
      padding: 8px 0; width: 100%; transition: background 0.15s;
    }
    .save-btn:hover { background: #b91c1c; }

    .saved-msg {
      text-align: center; font-size: 11px; color: #15803d;
      display: none;
    }

    .footer {
      padding: 8px 16px 12px;
      text-align: center;
      font-size: 10px;
      color: #aaa;
    }
    .footer a { color: #dc2626; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">YouTube AI Summarizer</div>
    <div class="header-sub">No API key required</div>
  </div>
</div>

<div class="body">

  <!-- Default AI provider -->
  <div class="field">
    <div class="label">Default AI Provider</div>
    <div class="provider-grid">
      <button class="provider-btn active" data-provider="claude">
        <span class="provider-dot" style="background:#d97706"></span>Claude
      </button>
      <button class="provider-btn" data-provider="chatgpt">
        <span class="provider-dot" style="background:#10a37f"></span>ChatGPT
      </button>
      <button class="provider-btn" data-provider="gemini">
        <span class="provider-dot" style="background:#4285f4"></span>Gemini
      </button>
    </div>
  </div>

  <hr class="divider">

  <!-- Default response language -->
  <div class="field">
    <label class="label" for="default-lang">Default Response Language</label>
    <select id="default-lang">
      <option value="en">English</option>
      <option value="es">Spanish</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="it">Italian</option>
      <option value="pt">Portuguese</option>
      <option value="ru">Russian</option>
      <option value="ja">Japanese</option>
      <option value="ko">Korean</option>
      <option value="zh">Chinese</option>
      <option value="ar">Arabic</option>
      <option value="hi">Hindi</option>
      <option value="nl">Dutch</option>
      <option value="pl">Polish</option>
      <option value="tr">Turkish</option>
      <option value="vi">Vietnamese</option>
    </select>
  </div>

  <hr class="divider">

  <!-- Auto-submit toggle -->
  <div class="toggle-row">
    <span class="toggle-label">Auto-submit prompt in AI tab</span>
    <label class="switch">
      <input type="checkbox" id="auto-submit" checked>
      <span class="slider"></span>
    </label>
  </div>

  <!-- Inject delay (shown when auto-submit is on) -->
  <div class="field" id="delay-field">
    <label class="label" for="inject-delay">Submit delay (ms)</label>
    <input type="number" id="inject-delay" value="1400" min="500" max="5000" step="100">
  </div>

  <hr class="divider">

  <button class="save-btn" id="save-btn">Save settings</button>
  <div class="saved-msg" id="saved-msg">Settings saved!</div>

</div>

<div class="footer">
  Opens in your existing AI session &mdash; no account linking needed.
</div>

<script src="popup.js"></script>
</body>
</html>
